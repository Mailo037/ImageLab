name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: release
        name: Resolve release version
        run: echo "tag=v$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Validate pushed tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "${{ steps.release.outputs.tag }}"
      - run: node scripts/assert-release-version.mjs "${{ steps.release.outputs.tag }}"
      - run: npm run typecheck
      - run: npm run lint
      - name: Production build and tests
        run: npm test
      - run: node scripts/release-notes.mjs "${{ steps.release.outputs.tag }}" > RELEASE_NOTES.md
      - id: existing-release
        name: Check existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.release.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub Release
        if: steps.existing-release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.release.outputs.tag }}" --target "$GITHUB_SHA" --title "ImageLab ${{ steps.release.outputs.tag }}" --notes-file RELEASE_NOTES.md
